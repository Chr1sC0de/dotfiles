# vim:fileencoding=utf-8:foldmethod=marker

font_family      GeistMono Nerd Font Mono

enable_audio_bell no

hide_window_decorations yes

background_opacity 0.80

# Apply the same translucency to Catppuccin background and surface colors.
transparent_background_colors #1e1e2e #181825 #11111b #313244 #45475a #585b70

map ctrl+page_up    next_tab

map ctrl+page_down previous_tab

map f2 send_text all \x1bOQ

# ctrl + ^ disabled in kitty
map ctrl+shift+6 none

include current-theme.conf


# BEGIN_KITTY_THEME
Catppuccin-Mocha
# END_KITTY_THEME
