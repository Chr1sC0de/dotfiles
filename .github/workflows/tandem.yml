name: Tandem integration
on:
  push:
    branches: [master]
    paths: ['config/nvim/**', 'tests/**', 'utils/install-tandem.sh', '.github/workflows/tandem.yml']
  pull_request:
    paths: ['config/nvim/**', 'tests/**', 'utils/install-tandem.sh', '.github/workflows/tandem.yml']
  workflow_dispatch:
    inputs:
      tandem_ref:
        description: 'Optional Git revision override; defaults to the pinned installer revision'
        required: false
        type: string
permissions:
  contents: read
jobs:
  integration:
    name: Linux (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: stevearc/conform.nvim
          ref: 016802de402556da54c36bd7359b441266b01cdd
          path: .ci/conform.nvim
      - name: Install Neovim, OpenCode V2, and Ruff
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          curl --fail --location --retry 3 https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nvim.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/nvim.tar.gz" | cut -d ' ' -f 1)" = bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/opencode" --no-audit --no-fund @opencode/cli@2.1.4
          echo "$RUNNER_TEMP/opencode/node_modules/.bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install ruff==0.12.12
          echo "$RUNNER_TEMP/ruff/bin" >> "$GITHUB_PATH"
      - name: Install Tandem from GitHub
        env:
          TANDEM_REF: ${{ inputs.tandem_ref }}
        run: bash utils/install-tandem.sh
      - name: Existing launcher and UI regression suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*_spec.lua; do
            nvim --headless -u NONE -i NONE -l "$test_file"
          done
          nvim --headless -u NONE -i NONE -l config/nvim/tests/opencode_commit_test.lua
          for test_file in tests/opencode*_spec.sh; do bash "$test_file"; done
      - name: Real OpenCode, daemon, buffer, and Conform integration
        env:
          TANDEM_BIN: /home/runner/.cargo/bin/tandem
          TANDEM_CONFORM: ${{ github.workspace }}/.ci/conform.nvim
          TANDEM_TEST_TMPDIR: ${{ runner.temp }}
        run: python3 tests/tandem_integration.py
      - name: Evidence summary
        if: always()
        shell: python
        run: |
          import json, os, pathlib
          result = pathlib.Path('artifacts/tandem/results.json')
          if result.exists():
              report = json.loads(result.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('### Tandem integration: ' + report['result'] + '\n\n')
                  summary.write('Real OpenCode V2 executable; deterministic local model fixture. No live model or Herdr GUI session.\n\n')
                  for name, version in report.get('versions', {}).items():
                      summary.write('- ' + name + ': `' + version + '`\n')
                  summary.write('\n')
                  for check in report['checks']:
                      summary.write('- PASS: ' + check + '\n')
                  if report.get('error'):
                      summary.write('\nFailure: `' + report['error'] + '`\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tandem-integration-evidence-${{ matrix.os }}
          path: artifacts/tandem/
          retention-days: 14
